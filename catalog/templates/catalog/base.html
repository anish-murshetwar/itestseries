
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}iTestPapers | Study Resources{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Explore subjects, chapter notes, question papers and study materials.{% endblock %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{% static 'catalog/css/style.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'catalog:home' %}">
                iTestPapers
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'catalog:home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'catalog:search' %}">Study Materials</a>
                    </li>
                </ul>

                <form class="d-flex ms-lg-3 mt-3 mt-lg-0"
                      action="{% url 'catalog:search' %}" method="get" role="search">
                    <input class="form-control form-control-sm me-2"
                           type="search" name="q"
                           placeholder="Search materials"
                           aria-label="Search study materials">
                    <button class="btn btn-warning btn-sm" type="submit">
                        Search
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer mt-5">
        <div class="container py-4 d-flex flex-column flex-md-row
                    justify-content-between gap-2">
            <span class="fw-semibold">iTestPapers</span>
            <span class="text-secondary">Study resources organised for easier learning.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
