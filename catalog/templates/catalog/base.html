{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}iTestSeries | ICSE Study Resources{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}ICSE Class 9 and 10 Biology and Chemistry notes, question papers and study materials.{% endblock %}">
    <meta name="theme-color" content="#173b68">

    <!-- Social sharing metadata -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="iTestSeries">
    <meta property="og:title" content="{% block og_title %}iTestSeries | ICSE Study Resources{% endblock %}">
    <meta property="og:description" content="{% block og_description %}ICSE Class 9 and 10 Biology and Chemistry notes, question papers and study materials.{% endblock %}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{% block twitter_title %}iTestSeries | ICSE Study Resources{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}ICSE Class 9 and 10 Biology and Chemistry notes, question papers and study materials.{% endblock %}">

    <link rel="icon" type="image/svg+xml" href="{% static 'catalog/images/favicon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{% static 'catalog/css/style.css' %}" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <nav class="navbar navbar-expand-lg site-navbar">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalog:home' %}" aria-label="iTestSeries home">
                <span class="brand-mark" aria-hidden="true">i</span>
                <span>iTestSeries</span>
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavigation">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'catalog:home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'catalog:search' %}">Study materials</a>
                    </li>
                </ul>

                <form class="nav-search d-flex ms-lg-4 mt-3 mt-lg-0"
                      action="{% url 'catalog:search' %}" method="get" role="search">
                    <label class="visually-hidden" for="site-search">Search study materials</label>
                    <input id="site-search" class="form-control" type="search" name="q"
                           placeholder="Search notes, papers..."
                           aria-label="Search study materials">
                    <button class="btn btn-primary" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <main id="main-content" class="container page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div class="footer-main">
                <a class="footer-brand" href="{% url 'catalog:home' %}">iTestSeries</a>
                <p class="footer-description">ICSE learning resources, organised chapter by chapter.</p>
            </div>
            <div class="footer-links">
                <a href="{% url 'catalog:home' %}">Home</a>
                <a href="{% url 'catalog:search' %}">Study materials</a>
            </div>
            <div class="footer-note">© {% now "Y" %} iTestSeries</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
