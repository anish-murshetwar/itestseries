
{% extends "catalog/base.html" %}

{% block title %}Register | iTestSeries{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="eyebrow">Join iTestSeries</div>
            <h1 class="section-heading mt-2">Create your account</h1>
            <p class="text-secondary">Register to access study materials.</p>
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary w-100 mt-3">
                Create account
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Already registered?
            <a href="{% url 'catalog:login' %}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
